[package]
name = "mini-wallpaper"
version = "1.1.0"
description = "Mini Wallpaper"
authors = ["you"]
license = "mit"
repository = "https://github.com/mi-saka10032/mini-wallpaper.git"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mini_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
anyhow = "1"
# release 编译期剔除 error 以下日志；dev 不受影响，运行时过滤见 setup.rs。
log = { version = "0.4", features = ["release_max_level_error"] }
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
image = "0.25.10"
uuid = { version = "1.23.0", features = ["v4"] }
fastrand = "2.4.1"
zip = "2"
walkdir = "2"
garde = { version = "0.22", features = ["derive"] }
futures = "0.3"
tauri-plugin-single-instance = "2.4.1"
urlencoding = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# JPEG 解码期 DCT 缩放（M/8 档位）：高分辨率图按目标尺寸直接解码，避免全量 IDCT。
# cmake feature 会 vendored 编译 libjpeg-turbo，不依赖系统库；nasm 加速需构建机安装。
turbojpeg = "1.5.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    # SHFileOperationW：监听壁纸删除走系统回收站（FOF_ALLOWUNDO 可撤销）
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

# dev 下解码太慢：依赖开 O3，本项目开 O1 保留断点可用。
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package."mini-wallpaper"]
opt-level = 1
