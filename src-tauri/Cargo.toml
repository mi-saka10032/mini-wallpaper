[package]
name = "mini-wallpaper"
version = "1.0.4"
description = "Mini Wallpaper"
authors = ["you"]
license = "mit"
repository = "https://github.com/mi-saka10032/mini-wallpaper.git"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mini_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
image = "0.25.10"
uuid = { version = "1.23.0", features = ["v4"] }
zip = "2"
walkdir = "2"
garde = { version = "0.22", features = ["derive"] }
futures = "0.3"
tauri-plugin-single-instance = "2.4.1"
urlencoding = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

# `tauri dev` 是 debug 构建，默认 opt-level=0。实测一张 4K JPEG 的
# image 解码 + to_rgba8 + decoder.rs 逐像素 RGBA→BGRA 在 O0 下约 1.9s，
# O3 下约 79ms（15~85 倍），这是 dev 切换壁纸接近 1s 的根因。
# 第三方依赖开满优化；本项目 crate 只开 O1，保留变量可见与断点可命中。
# 通配符 "*" 不覆盖 workspace 成员，因此两条都要写，且具体规则优先。
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package."mini-wallpaper"]
opt-level = 1
